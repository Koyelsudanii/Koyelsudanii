<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <title>Trabook Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Container for the navigation bar */
    .navbar1 {
      display: flex;
      background-color: #f4f4f4;
      padding: 20px;
      justify-content: space-between;
    }

    /* Styling for each section heading */
    .navbar1 div {
      margin-right: 20px;
    }

    .navbar1 div h2 {
      margin: 0;
    }

    /* Styling for the greyed-out items under each heading */
    .subheadings1 {
      color: grey;
      margin-top: 10px;
    }

    /* Styling for icons below Trabook */
    .icons1{
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .icons1 i {
      font-size: 24px;
      color: grey;
    }

    /* Thin grey line separator */
    .separator1 {
      border-top: 1px solid grey;
      margin: 20px 0;
    }

    /* Styling for the footer */
    .footer1 {
      text-align: right;
      font-size: 12px;
      color: lightgrey;
      margin: 20px;
    }

  </style>
</head>
<body>

  <!-- Navbar Section -->
  <div class="navbar1">
    <div>
      <h2>Trabook</h2>
      <p class="subheadings1">Tagline here</p>
      <div class="icons1">
        <i class="fa-brands fa-facebook"></i>       
        <i class="fa-brands fa-instagram"></i> 
        <i class="fa-brands fa-twitter"></i>      
    </div>
    </div>

    <div>
      <h2>Company</h2>
      <p class="subheadings1">About</p>
      <p class="subheadings1">Careers</p>
      <p class="subheadings1">Logistics</p>
      <p class="subheadings1">Privacy</p>
    </div>

    <div>
      <h2>Contact</h2>
      <p class="subheadings1">Help</p>
      <p class="subheadings1">Press</p>
      <p class="subheadings1">Affiliates</p>
    </div>

    <div>
      <h2>More</h2>
      <p class="subheadings1">Press</p>
      <p class="subheadings1">Our Blog</p>
      <p class="subheadings1">Low Fare Tips</p>
    </div>
  </div>

  <!-- Separator Line -->
  <div class="separator1"></div>

  <!-- Footer Section -->
  <div class="footer1">
    <p>Copyright, Trabook 2022, All rights reserved</p>
  </div>

  <!-- Font Awesome for Icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
