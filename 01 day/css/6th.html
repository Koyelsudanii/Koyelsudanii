<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe Section</title>      

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        
        /* Container for the subscribe section */
        .container1 {
            background-color: orange;
            color: white;
            width: 50%;
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 20px auto;
        }

        .subscribe-text1 {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box1 {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            width: 80%;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .input-box1 input {
            border: none;
            outline: none;
            flex: 1;
            padding: 10px;
            color: gray;
        }

        .input-box1 button {
            background-color: orange;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Navbar Section */
        .navbar1 {
            display: flex;
            background-color: #f4f4f4;
            padding: 20px;
            justify-content: space-between;
            margin: 20px auto;
            width: 80%;
        }

        /* Styling for each section heading */
        .navbar1 div {
            margin-right: 20px;
        }

        .navbar1 div h2 {
            margin: 0;
        }

        /* Styling for the greyed-out items under each heading */
        .subheadings1 {
            color: grey;
            margin-top: 10px;
        }

        /* Styling for icons below Trabook */
        .icons1 {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .icons1 i {
            font-size: 24px;
            color: grey;
        }

        /* Thin grey line separator */
        .separator1 {
            border-top: 1px solid grey;
            margin: 20px 0;
        }

        /* Styling for the footer */
        .footer1 {
            text-align: left;
            font-size: 12px;
            color: lightgrey;
            margin: 20px;
        }
    </style>
</head>
<body>
    /* 6th page*/
    <!-- Subscribe Section -->
    <div class="container1">
        <div class="subscribe-text1">
            Subscribe and get exclusive offers and deals.
        </div>
        <div class="input-box1">
            <input type="text" placeholder="Enter your email">
            <button>Subscribe</button>
        </div>
    </div>

    <!-- Navbar Section -->
    <div class="navbar1">
        <div>
            <h2>Trabook</h2>
            <p class="subheadings1">Tagline here</p>
            <div class="icons1">
                <i class="fas fa-phone-alt"></i>
                <i class="fas fa-envelope"></i>
                <i class="fas fa-map-marker-alt"></i>
            </div>
        </div>
        <div>
            <h2>Company</h2>
            <p class="subheadings1">About</p>
            <p class="subheadings1">Careers</p>
            <p class="subheadings1">Logistics</p>
            <p class="subheadings1">Privacy</p>
        </div>

        <div>
            <h2>Contact</h2>
            <p class="subheadings1">Help</p>
            <p class="subheadings1">Press</p>
            <p class="subheadings1">Affiliates</p>
        </div>

        <div>
            <h2>More</h2>
            <p class="subheadings1">Press</p>
            <p class="subheadings1">Our Blog</p>
            <p class="subheadings1">Low Fare Tips</p>
        </div>
    </div>

    <!-- Separator Line -->
    <div class="separator1"></div>

    <!-- Footer Section -->
    <div class="footer1">
        <p>Copyright, Trabook 2022, All rights reserved</p>
    </div>

    <!-- Font Awesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
