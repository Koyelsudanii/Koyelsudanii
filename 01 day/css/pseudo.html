<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Documnet</title>
</head>
<style>
    a{
        font-size: 30px;
    }
    /* selectors: pseudo classes */
    /*APPLIES TO LINKS THAT HAVE NOT BEEN VISITED. */
    a:link{
        color: orange;
    }
    /*applies once the link has been visited by the user. */
    a:visited{
        color:yellowgreen;
    }
    /* applies while an element is being activated by the 
    user. for eg, between the times the user presses the mpouse button and releases it. */
    a:active{
        color: blue;
    }
    /* applies when the user designates an element with a  pointing device,
    but does not necessarily activate it.
    for eg, a visual user agent could apply this pseudo-class when
    the cursor hovers over a box generated by the elemnt */
    a:hover{
        background-color: red;
        color: white;
  }
</style>
<body>
    <a href="https://www.google.com">Google</a>
</body>
</html>
