<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        border: 2px solid red;
        background-color: rgb(6, 83, 58);
        width: 400px;
        display: flex;
        height:300px;
        flex-wrap:wrap;
        margin: 10px;
    }
    .container1{
        align-content: stretch;
    }
    .container2{
        align-content: center;
    }
    .container3{
        align-content: flex-start;
    }   
    .container4{
        align-content: flex-end;

    }   
    .container5{
        align-content: space-between;
    }
    .child {
        width: 30px;
        height: 30px;
        background-color: green;
        margin: 10px;
    }
    .item1{
        background-color: rosybrown;
    }
    .item2{
        background-color: yellow;
    }
    .item3
    {
        background-color: blue;
    }
    .item4
    {
        background-color: red;
    }
    .item5
    {
        background-color: green;
    }
</style>
<body>
    <div class="container container1">
        <div class="child item1">1</div>
        <div class="child item2">1</div>
        <div class="child item3">1</div>
        <div class="child item4">1</div>
        <div class="child item5">1</div>
    </div>
    <div class="container container2">
        <div class="child item1">2</div>
        <div class="child item2">2</div>
        <div class="child item3">2</div>
        <div class="child item4">2</div>
        <div class="child item5">2</div>
    </div>
    <div class="container container3">
        <div class="child item1">3</div>
        <div class="child item2">3</div>
        <div class="child item3">3</div>
        <div class="child item4">3</div>
        <div class="child item5">3</div>
    </div>
    <div class="container container4">
        <div class="child item1">4</div>
        <div class="child item2">4</div>
        <div class="child item3">4</div>
        <div class="child item4">4</div>
        <div class="child item5">4</div>
    </div>
    <div class="container container5">
        <div class="child item1">5</div>
        <div class="child item2">5</div>
        <div class="child item3">5</div>
        <div class="child item4">5</div>
        <div class="child item5">5</div>
    </div>
</body>
</html>
