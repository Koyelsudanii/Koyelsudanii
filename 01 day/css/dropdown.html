<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Document</title>
</head>
<style>
    .dropdown{
        padding: 10px;
        border:1px solid black;
        background-color: navy;
        color: white;
        position:relative;
        margin:10px;
        width:100px;
        left:100px;
    }
    .dropdownlist{
        position:absolute;
        left:30px; 
        background-color: black;
        margin:10px;
        display:none;
    }
    .name{
        border: 1px dotted solid black;
        padding: 5px;
        width:100px;
    }
    .dropdown:hover .dropdownlist{
        display:block;
    }
    .styleicon{
        margin: left;
    }
</style>
<body>
    <div class="dropdown">courses <i class="fa-solid fa-caret-down"></i>
        <div class="dropdownlist">
            <div class="name"><i class="fa-brands fa-html5"></i> HTML</div>
            <div class="name"><i class="fa-brands fa-css"></i>CSS</div>
            <div class="name"><i class="fa-brands fa-js"></i>JS</div>
        </div>
    </div>
</body>
</html>
