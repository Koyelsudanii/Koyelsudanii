        background-color: blue;
    }
    .item4
    {
        background-color: red;
    }
    .item5
    {
        background-color: green;
    }
</style>
<body>

        <div class="child item1"></div>
        <div class="child item2"></div>
        <div class="child item3"></div>

</html>
