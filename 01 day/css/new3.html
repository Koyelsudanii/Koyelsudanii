<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        .container {
            background-color: orange;
            color: white;
            width: 50%;
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .subscribe-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            width: 80%;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }
        .input-box input {
            border: none;
            outline: none;
            flex: 1;
            padding: 10px;
            color: gray;
        }
        .input-box button {
            background-color: orange;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }
        .design-left-bottom {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.3;
        }
        .design-right-top {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            background-color: white;
            border-radius: 50%;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="design-left-bottom"></div>
        <div class="design-right-top"></div>
        <div class="subscribe-text">
            Subscribe and get exclusive offers and deals.
        </div>
        <div class="input-box">
            <input type="text" placeholder="Enter your email">
            <button>Subscribe</button>
        </div>
    </div>
</body>
</html>
