<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ask the age</h1>
    <script>
        alert("you need to enter ur age")
        var age=prompt("enter your age")
        if(age>=18)
        {
            alert("you are eligible to vote")
        }
        else
        {
            alert("you are not eligible to vote")
        }
        console.log(age)
        var confirm=confirm("do u want to continue?")
        if(confirm==true)
        {
            alert("you agreed to continue")
        }
        else
        {
            alert("you have cancelled to vote")
        }
        console.log(confirm)
    </script>
</body>
</html>
