<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>grid</title>
</head>
<style>
    .container{
        display: grid;
        width: 50%;
        background: none;
        grid-template-columns: 100px 50px 50px; /*also can be given auto auto */
    }
    div{
        padding: 5px;
        background-color: green;
        margin: 1px;
        border:1px solid black;
    }
    .div1{
        background-color: blue;
    }
</style>
<body>
    <div class="container">
        <div>01</div>
        <div>02</div>
        <div>03</div>
        <div class="div1">04</div>
        <div>05</div>
        <div>06</div>
        <div>07</div>
        <div>08</div>
        <div>09</div>
    </div>
    <div class="grid grid-cols-12 divide-indigo-500">
        <div class="bg-grey-900">01</div>
        <div class="bg-grey-900">02</div>
        <div class="bg-grey-900">03</div>
        <div class="bg-grey-900">04</div>
        <div class="bg-grey-900">05</div>
        <div class="bg-grey-900">06</div>
        <div class="bg-grey-900">07</div>
        <div class="bg-grey-900">08</div>
        <div class="bg-grey-900">09</div>
        <div class="bg-grey-900">10</div>
        <div class="bg-grey-900">11</div>
        <div class="bg-grey-900">12</div>
    </div>
</body>
</html>
